[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "model-error-bound"
version = "0.1.0"
description = "Formal interval bounds for output differences between PyTorch models and compiled variants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "numpy==2.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
